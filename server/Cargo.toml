[package]
name = "workbench"
version = "0.5.3"
edition = "2024"
description = "AI-centric developer workspace: Claude Code sessions, editor, git, GitLab, Atlassian and deployed apps in one window"
license = "MIT"
# `cargo run` runs the server; `--bin workbenchw` the Windows launcher.
default-run = "workbench"

[[bin]]
name = "workbench"
path = "src/main.rs"

# The Windows launcher behind `workbench service` (a GUI program, so sign-in shows no
# console); a stub elsewhere.
[[bin]]
name = "workbenchw"
path = "src/bin/workbenchw.rs"
test = false

[profile.dev.package."*"]
opt-level = 2

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
ammonia = "4.2.0"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6"
dirs = "7.0.0"
futures = "0.3.34"
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hex = "0.4.3"
hkdf = "0.12"
ignore = "0.4.33"
keyring = "4"
mime_guess = "2.0.5"
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }
notify = "8"
notify-debouncer-full = "0.7"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
portable-pty = "0.9"
pulldown-cmark = "0.13.4"
qrcode = "0.14.1"
quick-xml = "0.42.0"
rand = "0.9"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "http2", "multipart", "charset"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
toml = "1.1.6"
toml_edit = "0.25"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace", "compression-full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
vt100 = "0.16"
zstd = { version = "0.14", default-features = false }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
rustls-platform-verifier = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
nix = { version = "0.31", features = ["signal", "process", "term", "fs", "user"] }

# Windows: the util::os layer (docs/windows-port.md).
[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_RestartManager",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# The icon and version resource of the Windows executables (build.rs; unused elsewhere).
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.29"
